name: Build and Release Logseq Plugin

on:
  push:
    tags:
      - 'v*'
      - 'V*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号(例 V1.0.3)'
        required: true
        default: 'V1.0.3'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Package Logseq Plugin to Zip
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          ZIP_NAME="Graph-Fluid-Spring-${VERSION}.zip"

          mkdir -p release-pkg

          # 复制根目录源文件
          cp index.html release-pkg/
          cp index.js release-pkg/
          cp package.json release-pkg/
          cp lsplugin.user.js release-pkg/

          # 复制 src 目录（包含 camera.js, config.js, data.js 等）
          cp -r src release-pkg/

          # 复制可选文件
          [ -f README.md ] && cp README.md release-pkg/
          [ -f icon.svg ] && cp icon.svg release-pkg/
          [ -f LICENSE ] && cp LICENSE release-pkg/

          cd release-pkg
          zip -r "../${ZIP_NAME}" ./*
          cd ..

          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Extract Current Version Notes
        shell: node {0}
        env:
          CURRENT_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          const fs = require('fs');
          if (!fs.existsSync('CHANGELOG.md')) {
            fs.writeFileSync('CURRENT_RELEASE_NOTES.md', '常规更新与优化');
            process.exit(0);
          }
          const content = fs.readFileSync('CHANGELOG.md', 'utf8');
          const version = process.env.CURRENT_VERSION.replace(/^[vV]/, '').trim();

          const regex = new RegExp(`##\\s*\\[?[vV]?${version}\\]?[^\\n]*\\n([\\s\\S]*?)(?=\\n##|$)`, 'i');
          const match = content.match(regex);

          const notes = (match && match[1]) ? match[1].trim() : `Release ${process.env.CURRENT_VERSION}`;
          fs.writeFileSync('CURRENT_RELEASE_NOTES.md', notes);
          console.log('--- 提取出的当前版本说明 ---');
          console.log(notes);

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: "${{ inputs.version || github.ref_name }}"
          body_path: CURRENT_RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: ${{ env.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}